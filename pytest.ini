# Für die Testansicht im Codespace (Repo-Wurzel). In den Übungsordnern gilt jeweils deren eigene pytest.ini.
[pytest]
addopts = --import-mode=importlib
pythonpath =
    01_anforderung_und_plan/starter
    02_tests_und_fehlersuche/starter
    03_copilot_anpassen/starter
    04_issue_im_terminal/starter
testpaths =
    01_anforderung_und_plan/starter
    02_tests_und_fehlersuche/starter/tests
    03_copilot_anpassen/starter/tests
    04_issue_im_terminal/starter/tests
